<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LagerManager Analytics</title>

<style>
:root{
  --bg:#000;
  --card:#111;
  --card2:#1c1c1e;
  --line:#2a2a2c;
  --text:#f5f5f7;
  --muted:#8e8e93;
  --green:#30d158;
  --red:#ff453a;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  background:#000;
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    Helvetica,
    Arial,
    sans-serif;
  -webkit-font-smoothing:antialiased;
}

body{
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:1100px;
  min-height:100vh;
  margin:0 auto;
}

/* =========================
   HEADER
========================= */

.header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(0,0,0,.95);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border-bottom:1px solid var(--line);
  padding:12px 14px 10px;
}

.headerTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.title{
  font-size:22px;
  line-height:25px;
  font-weight:700;
  letter-spacing:-.5px;
}

.subtitle{
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
}

.headerButtons{
  display:flex;
  gap:7px;
}

.iconButton{
  width:40px;
  height:40px;
  border-radius:12px;
  background:#1c1c1e;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
}

.search{
  position:relative;
  margin-top:10px;
}

.search input{
  width:100%;
  height:44px;
  border-radius:14px;
  border:1px solid #292929;
  background:#1c1c1e;
  color:#fff;
  outline:none;
  padding:0 42px 0 40px;
  font-size:16px;
}

.search input::placeholder{
  color:#8e8e93;
}

.searchIcon{
  position:absolute;
  left:14px;
  top:10px;
  font-size:20px;
  color:#8e8e93;
}

.clearSearch{
  position:absolute;
  right:8px;
  top:7px;
  width:30px;
  height:30px;
  border-radius:50%;
  background:#3a3a3c;
  color:#aaa;
  display:none;
  padding:0;
}

.tabs{
  display:flex;
  gap:2px;
  margin-top:10px;
  padding:2px;
  border-radius:12px;
  background:#1c1c1e;
}

.tab{
  flex:1;
  min-width:0;
  padding:8px 4px;
  border-radius:10px;
  background:transparent;
  color:#8e8e93;
  font-size:12px;
}

.tab.active{
  background:#3a3a3c;
  color:#fff;
  font-weight:600;
}

/* =========================
   CONTENT
========================= */

.content{
  padding:12px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
  margin-bottom:14px;
}

.stat{
  min-height:74px;
  padding:11px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#111;
}

.statLabel{
  color:var(--muted);
  font-size:11px;
  margin-bottom:5px;
}

.statValue{
  font-size:19px;
  font-weight:700;
  letter-spacing:-.3px;
}

.green{
  color:var(--green)!important;
}

.red{
  color:var(--red)!important;
}

.section{
  margin-bottom:15px;
}

.sectionHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:7px;
}

.sectionTitle{
  font-size:17px;
  font-weight:700;
  letter-spacing:-.2px;
}

.sectionInfo{
  color:var(--muted);
  font-size:11px;
}

.card{
  background:#111;
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
}

.row{
  padding:11px 12px;
  border-bottom:1px solid var(--line);
}

.row:last-child{
  border-bottom:0;
}

.rowTop{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}

.rowTitle{
  font-size:14px;
  font-weight:600;
  line-height:18px;
}

.rowSub{
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
  line-height:17px;
}

.rowValue{
  text-align:right;
  white-space:nowrap;
  font-size:13px;
  font-weight:600;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:9px;
}

.smallButton{
  padding:7px 10px;
  border-radius:9px;
  background:#29292b;
  color:#fff;
  font-size:12px;
}

.smallButton.greenButton{
  color:var(--green);
}

.smallButton.redButton{
  color:var(--red);
}

.badge{
  display:inline-block;
  padding:3px 7px;
  border-radius:7px;
  background:#29292b;
  color:#ddd;
  font-size:10px;
  margin-right:3px;
}

.badge.greenBadge{
  color:var(--green);
}

.badge.redBadge{
  color:var(--red);
}

.empty{
  padding:30px 15px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
  line-height:20px;
}

/* =========================
   MODAL
========================= */

.modalBack{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.75);
}

.modalBack.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:680px;
  max-height:94vh;
  overflow:auto;
  background:#1c1c1e;
  border-radius:20px 20px 0 0;
  padding:14px;
  padding-bottom:calc(18px + env(safe-area-inset-bottom));
}

.modalHandle{
  width:38px;
  height:5px;
  margin:0 auto 14px;
  border-radius:4px;
  background:#555;
}

.modalTitle{
  font-size:20px;
  font-weight:700;
  margin-bottom:12px;
}

.infoBox{
  padding:11px;
  border-radius:12px;
  background:#29292b;
  color:#d8d8da;
  font-size:12px;
  line-height:19px;
  margin-bottom:10px;
}

.modalActions{
  display:flex;
  gap:7px;
  margin-top:12px;
}

.modalActions button{
  flex:1;
  min-height:42px;
  border-radius:12px;
}

.primary{
  background:var(--green);
  color:#000;
  font-weight:700;
}

.secondary{
  background:#3a3a3c;
  color:#fff;
}

.danger{
  background:var(--red);
  color:#fff;
}

.fileInput{
  display:none;
}

/* =========================
   BELEG VIEWER
========================= */

.viewerBack{
  position:fixed;
  inset:0;
  z-index:300;
  display:none;
  flex-direction:column;
  background:#000;
}

.viewerBack.show{
  display:flex;
}

.viewerHeader{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:
    10px
    12px
    10px
    12px;
  padding-top:calc(10px + env(safe-area-inset-top));
  background:rgba(0,0,0,.96);
  border-bottom:1px solid #222;
}

.viewerTitle{
  flex:1;
  min-width:0;
  font-size:16px;
  font-weight:600;
  text-align:center;
}

.viewerButton{
  min-width:42px;
  height:40px;
  padding:0 11px;
  border-radius:11px;
  background:#1c1c1e;
  color:#fff;
  font-size:13px;
}

.viewerButton.green{
  color:var(--green);
}

.viewerContent{
  flex:1;
  min-height:0;
  overflow:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px;
}

.viewerContent img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  border-radius:5px;
}

.viewerContent iframe{
  width:100%;
  height:100%;
  border:0;
  background:#fff;
}

.viewerContent a{
  color:var(--green);
}

/* =========================
   DESKTOP
========================= */

@media(min-width:700px){

  .stats{
    grid-template-columns:repeat(4,1fr);
  }

  .modalBack{
    align-items:center;
  }

  .modal{
    border-radius:20px;
    max-height:88vh;
  }
}

/* =========================
   ACCESSIBILITY
========================= */

button:active{
  transform:scale(.98);
  opacity:.7;
}

input:focus{
  border-color:#555!important;
}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="headerTop">

    <div>
      <div class="title">Analytics</div>
      <div class="subtitle">LagerManager Auswertung</div>
    </div>

    <div class="headerButtons">
      <button
        class="iconButton"
        onclick="openImport()"
        aria-label="Import">
        ↥
      </button>

      <button
        class="iconButton"
        onclick="exportData()"
        aria-label="Export">
        ↧
      </button>
    </div>

  </div>

  <div class="search">

    <span class="searchIcon">⌕</span>

    <input
      id="globalSearch"
      type="search"
      placeholder="Alles durchsuchen …"
      autocomplete="off"
      oninput="runSearch()">

    <button
      id="clearSearch"
      class="clearSearch"
      onclick="clearSearch()">
      ×
    </button>

  </div>

  <div class="tabs">

    <button
      id="tabOverview"
      class="tab active"
      onclick="setTab('overview')">
      Übersicht
    </button>

    <button
      id="tabSales"
      class="tab"
      onclick="setTab('sales')">
      Verkäufe
    </button>

    <button
      id="tabPurchases"
      class="tab"
      onclick="setTab('purchases')">
      Einkäufe
    </button>

    <button
      id="tabSearch"
      class="tab"
      onclick="setTab('search')">
      Suche
    </button>

  </div>

</header>

<main
  id="content"
  class="content">
</main>

</div>


<!-- IMPORT MODAL -->

<div
  id="importModal"
  class="modalBack">

  <div class="modal">

    <div class="modalHandle"></div>

    <div class="modalTitle">
      LagerManager-Daten importieren
    </div>

    <div class="infoBox">
      Wähle hier die JSON-Sicherung aus deiner
      LagerManager-App aus.
      <br><br>
      Die Analytics-App verarbeitet die Daten lokal
      auf deinem Gerät.
    </div>

    <input
      id="jsonFile"
      class="fileInput"
      type="file"
      accept=".json,application/json">

    <div class="modalActions">

      <button
        class="secondary"
        onclick="closeImport()">
        Abbrechen
      </button>

      <button
        class="primary"
        onclick="document.getElementById('jsonFile').click()">
        Datei auswählen
      </button>

    </div>

  </div>

</div>


<!-- DETAIL MODAL -->

<div
  id="detailModal"
  class="modalBack">

  <div class="modal">

    <div class="modalHandle"></div>

    <div id="detailContent"></div>

    <div class="modalActions">

      <button
        class="secondary"
        onclick="closeDetail()">
        ← Zurück
      </button>

    </div>

  </div>

</div>


<!-- BELEG VIEWER -->

<div
  id="viewer"
  class="viewerBack">

  <div class="viewerHeader">

    <button
      class="viewerButton"
      onclick="closeViewer()">
      ← Zurück
    </button>

    <div
      id="viewerTitle"
      class="viewerTitle">
      Rechnung / Beleg
    </div>

    <button
      id="viewerDownload"
      class="viewerButton green"
      onclick="downloadCurrentDocument()">
      ↓
    </button>

  </div>

  <div
    id="viewerContent"
    class="viewerContent">
  </div>

</div>


<script>
"use strict";

/* =========================================================
   GRUNDDATEN
========================================================= */

let data = {
  artikel: [],
  sales: []
};

let currentTab = "overview";

let searchResults = {
  sales:[],
  articles:[]
};

let currentDocument = null;

const STORAGE_KEY =
  "LagerManagerAnalyticsV3";


/* =========================================================
   START
========================================================= */

document.addEventListener("DOMContentLoaded",()=>{

  loadLocalData();

  document
    .getElementById("jsonFile")
    .addEventListener(
      "change",
      importJSON
    );

  render();

});


/* =========================================================
   HILFSFUNKTIONEN
========================================================= */

function clean(value){

  if(value === null ||
     value === undefined){

    return "";
  }

  return String(value).trim();
}


function lower(value){

  return clean(value)
    .toLocaleLowerCase("de-DE");
}


function normalizeKey(value){

  return lower(value)
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/ß/g,"ss")
    .replace(/[^a-z0-9]/g,"");
}


/* =========================================================
   PLATTFORMEN
========================================================= */

function normalizePlatform(value){

  const key =
    normalizeKey(value);

  const aliases = {

    ebay:"eBay",

    vinted:"Vinted",
    vintef:"Vinted",
    vintet:"Vinted",

    kleinanzeigen:"Kleinanzeigen",

    amazon:"Amazon",

    shopify:"Shopify",

    flohmarkt:"Flohmarkt",

    etsy:"Etsy",

    paypal:"PayPal",

    sonstiges:"Sonstiges"

  };

  return aliases[key] ||
    clean(value) ||
    "Sonstiges";
}


/* =========================================================
   EINKAUFSORTE / GESCHÄFTE
========================================================= */

function normalizeSource(value){

  const key =
    normalizeKey(value);

  if(!key){
    return "Unbekannt";
  }

  /*
    Alles, was zu Haus der Geschenke
    in Ilmenau gehört, wird zusammengeführt.
  */

  if(
    key.includes("hausdergeschenke") ||
    key.includes("hausgeschenke")
  ){
    return "Haus der Geschenke - Ilmenau";
  }

  const aliases = {

    mueller:"Müller",
    muellerdrogerie:"Müller",

    sportspar:"Sportspar",

    picksport:"Picksport",

    amazon:"Amazon",

    ebay:"eBay",

    vinted:"Vinted",

    kleinanzeigen:"Kleinanzeigen"

  };

  return aliases[key] ||
    clean(value) ||
    "Unbekannt";
}


/* =========================================================
   MARKEN / ARTIKELGRUPPEN
========================================================= */

/*
  Die Schreibweise wird nicht berücksichtigt.
  McKinley, MCKINLEY, McKINLEY usw.
  werden dadurch als dasselbe erkannt.
*/

const BRAND_NAMES = {

  adidas:"Adidas",
  nike:"Nike",
  puma:"Puma",
  reebok:"Reebok",
  mckinley:"McKinley",
  fjallraven:"Fjällräven",
  jackwolfskin:"Jack Wolfskin",
  thenorthface:"The North Face",
  columbia:"Columbia",
  salomon:"Salomon",
  mammut:"Mammut",
  vaude:"Vaude",
  patagonia:"Patagonia",
  underarmour:"Under Armour",
  asics:"ASICS",
  newbalance:"New Balance",
  converse:"Converse",
  vans:"Vans",
  levis:"Levi's",
  tommyhilfiger:"Tommy Hilfiger",
  calvinklein:"Calvin Klein",
  bosshugo:"Hugo Boss",
  hugoboss:"Hugo Boss",
  boss:"Boss",
  lacoste:"Lacoste",
  esprit:"Esprit",
  soliver:"s.Oliver",
  engelbertstrauss:"Engelbert Strauss",
  pokemon:"Pokémon",
  nintendo:"Nintendo",
  lego:"LEGO",
  timberland:"Timberland",
  jackjones:"Jack & Jones",
  only:"Only"

};


function getArticleGroup(name){

  const original =
    clean(name);

  if(!original){
    return "Unbekannt";
  }

  /*
    Laut deiner Vorgabe:
    Das erste Wort ist der Artikelname.
  */

  const firstWord =
    original.split(/\s+/)[0];

  const key =
    normalizeKey(firstWord);

  if(BRAND_NAMES[key]){
    return BRAND_NAMES[key];
  }

  /*
    Falls der erste Begriff kein bekannter Markenname ist,
    bleibt er trotzdem die Artikelgruppe.
  */

  return firstWord;
}


/* =========================================================
   ZAHLEN
========================================================= */

function number(value){

  if(typeof value === "number"){
    return isFinite(value)
      ? value
      : 0;
  }

  let text =
    clean(value)
      .replace(/[€$]/g,"")
      .replace(/\s/g,"");

  if(!text){
    return 0;
  }

  if(
    text.includes(",") &&
    text.includes(".")
  ){

    if(
      text.lastIndexOf(",") >
      text.lastIndexOf(".")
    ){

      text =
        text
          .replace(/\./g,"")
          .replace(",",".");
    }
    else{

      text =
        text.replace(/,/g,"");
    }

  }
  else{

    text =
      text.replace(",",".");
  }

  const n =
    parseFloat(text);

  return isFinite(n)
    ? n
    : 0;
}


function formatEuro(value){

  return number(value)
    .toLocaleString(
      "de-DE",
      {
        style:"currency",
        currency:"EUR"
      }
    );
}


/* =========================================================
   DATEN
========================================================= */

function dateValue(value){

  if(!value){
    return 0;
  }

  const d =
    new Date(value);

  if(!isNaN(d)){
    return d.getTime();
  }

  const m =
    clean(value).match(
      /^(\d{2})[-./](\d{2})[-./](\d{4})$/
    );

  if(m){

    return new Date(
      Number(m[3]),
      Number(m[2])-1,
      Number(m[1])
    ).getTime();

  }

  return 0;
}


function formatDate(value){

  const text =
    clean(value);

  if(!text){
    return "—";
  }

  const d =
    new Date(text);

  if(!isNaN(d)){

    return d.toLocaleDateString(
      "de-DE"
    );

  }

  if(
    /^\d{2}-\d{2}-\d{4}$/.test(text)
  ){
    return text;
  }

  if(
    /^\d{4}-\d{2}-\d{2}$/.test(text)
  ){

    const parts =
      text.split("-");

    return `${parts[2]}.${parts[1]}.${parts[0]}`;
  }

  return text;
}


/* =========================================================
   STORNO
========================================================= */

function isStorno(s){

  return !!(
    s &&
    (
      s.isStorno === true ||
      lower(s.isStorno) === "true" ||
      lower(s.status) === "storno"
    )
  );

}


/* =========================================================
   VERKAUF
========================================================= */

function saleRevenue(s){

  return number(s.total);
}


function saleShipping(s){

  return number(s.shipping);
}


function saleFees(s){

  return number(s.fees);
}


function saleCost(s){

  return (
    number(s.buyPrice) *
    Math.max(
      1,
      number(s.qty)
    )
  );
}


function saleProfit(s){

  if(isStorno(s)){
    return 0;
  }

  return (
    saleRevenue(s)
    -
    saleShipping(s)
    -
    saleFees(s)
    -
    saleCost(s)
  );
}


function validSales(){

  return data.sales.filter(
    s => !isStorno(s)
  );
}


/* =========================================================
   ADRESSE
========================================================= */

function addressParts(s){

  const a =
    s && s.address;

  if(
    typeof a === "object" &&
    a !== null
  ){

    return {

      name:clean(
        a.name ||
        a.vorname ||
        a.fullName
      ),

      street:clean(
        a.street ||
        a.strasse ||
        a.address
      ),

      zip:clean(
        a.zip ||
        a.plz ||
        a.postcode
      ),

      city:clean(
        a.city ||
        a.stadt ||
        a.ort
      ),

      country:clean(
        a.country ||
        a.land
      )

    };
  }

  return {

    name:clean(s.name),

    street:clean(a),

    zip:clean(
      s.zip ||
      s.plz
    ),

    city:clean(
      s.city ||
      s.stadt
    ),

    country:""

  };
}


function buyerName(s){

  const a =
    addressParts(s);

  return clean(
    s.name ||
    s.kundenname ||
    s.buyer ||
    s.buyerName ||
    a.name
  );
}


function buyerCity(s){

  const a =
    addressParts(s);

  return clean(
    a.city ||
    s.city ||
    s.stadt ||
    s.kundenstadt
  );
}


function buyerZip(s){

  const a =
    addressParts(s);

  return clean(
    a.zip ||
    s.zip ||
    s.plz
  );
}


function buyerStreet(s){

  const a =
    addressParts(s);

  return clean(
    a.street ||
    s.street ||
    s.strasse
  );
}


/* =========================================================
   BELEG / RECHNUNG
========================================================= */

/*
  Die App akzeptiert verschiedene Feldnamen.
  Dadurch können ältere und neuere Daten
  gleichermaßen verwendet werden.
*/

function getDocumentSource(object,type){

  if(!object){
    return "";
  }

  const fields =
    type === "purchase"

    ? [
        "rechnungImg",
        "rechnungImage",
        "rechnung",
        "belegImg",
        "belegImage",
        "beleg",
        "receiptImg",
        "receiptImage",
        "receipt",
        "invoiceImg",
        "invoiceImage",
        "invoice"
      ]

    : [
        "invoiceImg",
        "invoiceImage",
        "rechnungImg",
        "rechnungImage",
        "rechnung",
        "invoice",
        "belegImg",
        "belegImage",
        "beleg"
      ];

  for(
    const field of fields
  ){

    const value =
      object[field];

    if(
      typeof value === "string" &&
      value.trim()
    ){
      return value;
    }

  }

  return "";
}


function getDocumentName(object,type){

  if(!object){
    return "Rechnung / Beleg";
  }

  return clean(
    object.invoiceName ||
    object.rechnungName ||
    object.belegName ||
    object.receiptName ||
    (
      type === "purchase"
      ? "Einkaufsbeleg"
      : "Verkaufsrechnung"
    )
  );
}


/* =========================================================
   UNIVERSAL SEARCH
========================================================= */

function searchableSale(s){

  const a =
    addressParts(s);

  return [

    s.invoiceNr,
    s.rechnungsnummer,

    s.artnr,
    s.name,
    s.artikelname,

    s.platform,
    normalizePlatform(s.platform),

    s.date,
    s.verkaufsdatum,

    s.buyDate,
    s.kaufdatum,

    s.sourcingLoc,
    normalizeSource(s.sourcingLoc),

    s.groesse,
    s.size,

    buyerName(s),
    buyerCity(s),
    buyerZip(s),
    buyerStreet(s),

    a.country,

    s.notiz,
    s.note,

    s.total,
    s.buyPrice,
    s.shipping,
    s.fees

  ]
  .map(clean)
  .join(" | ")
  .toLocaleLowerCase("de-DE");
}


function searchableArticle(a){

  return [

    a.artnr,
    a.name,

    getArticleGroup(a.name),

    a.groesse,
    a.size,

    a.zustand,

    a.ort,
    normalizeSource(a.ort),

    a.datum,
    a.kaufdatum,

    a.preis,

    a.notiz,
    a.note,

    a.menge,

    getDocumentName(a,"purchase"),
    getDocumentSource(a,"purchase")

  ]
  .map(clean)
  .join(" | ")
  .toLocaleLowerCase("de-DE");
}


function runSearch(){

  const input =
    document.getElementById(
      "globalSearch"
    );

  const query =
    lower(input.value);

  document
    .getElementById("clearSearch")
    .style.display =
      query
      ? "block"
      : "none";

  if(!query){

    searchResults = {
      sales:[],
      articles:[]
    };

    currentTab = "overview";

    updateTabs();
    render();

    return;
  }

  const terms =
    query
      .split(/\s+/)
      .filter(Boolean);

  const sales =
    data.sales.filter(s=>{

      const text =
        searchableSale(s);

      return terms.every(
        term => text.includes(term)
      );

    });

  const articles =
    data.artikel.filter(a=>{

      const text =
        searchableArticle(a);

      return terms.every(
        term => text.includes(term)
      );

    });

  searchResults = {
    sales,
    articles
  };

  currentTab = "search";

  updateTabs();
  renderSearch();
}


function searchText(text){

  const input =
    document.getElementById(
      "globalSearch"
    );

  input.value = text;

  runSearch();
}


function clearSearch(){

  document.getElementById(
    "globalSearch"
  ).value = "";

  document.getElementById(
    "clearSearch"
  ).style.display = "none";

  searchResults = {
    sales:[],
    articles:[]
  };

  currentTab = "overview";

  updateTabs();
  render();
}


/* =========================================================
   LOCAL STORAGE
========================================================= */

function loadLocalData(){

  try{

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );

    if(saved){

      const parsed =
        JSON.parse(saved);

      data.artikel =
        Array.isArray(parsed.artikel)
        ? parsed.artikel
        : [];

      data.sales =
        Array.isArray(parsed.sales)
        ? parsed.sales
        : [];

    }

  }catch(error){

    console.error(
      "Daten konnten nicht geladen werden:",
      error
    );

  }
}


function saveLocalData(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );

  }catch(error){

    console.error(error);

  }
}


/* =========================================================
   IMPORT
========================================================= */

function openImport(){

  document
    .getElementById("importModal")
    .classList.add("show");

}


function closeImport(){

  document
    .getElementById("importModal")
    .classList.remove("show");

}


function importJSON(event){

  const file =
    event.target.files[0];

  if(!file){
    return;
  }

  const reader =
    new FileReader();

  reader.onload = event => {

    try{

      const parsed =
        JSON.parse(
          event.target.result
        );

      const artikel =
        parsed.artikel ||
        parsed.inventory ||
        parsed.items ||
        [];

      const sales =
        parsed.sales ||
        parsed.verkaeufe ||
        parsed.verkäufe ||
        [];

      data = {

        artikel:
          Array.isArray(artikel)
          ? artikel
          : [],

        sales:
          Array.isArray(sales)
          ? sales
          : []

      };

      saveLocalData();

      closeImport();

      currentTab = "overview";

      updateTabs();
      render();

      alert(
        "Import erfolgreich.\n\n" +
        data.artikel.length +
        " Artikel\n" +
        data.sales.length +
        " Verkäufe"
      );

    }catch(error){

      console.error(error);

      alert(
        "Die JSON-Datei konnte nicht gelesen werden."
      );

    }

    event.target.value = "";

  };

  reader.readAsText(file);
}


/* =========================================================
   EXPORT
========================================================= */

function exportData(){

  const blob =
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type:"application/json"
      }
    );

  const url =
    URL.createObjectURL(blob);

  const link =
    document.createElement("a");

  link.href = url;

  link.download =
    "LagerManager-Analytics-" +
    new Date()
      .toISOString()
      .slice(0,10) +
    ".json";

  document.body.appendChild(link);

  link.click();

  link.remove();

  URL.revokeObjectURL(url);
}

/* =========================================================
   STATISTIK
========================================================= */

function totalRevenue(){

  return validSales()
    .reduce(
      (sum,s)=>
        sum + saleRevenue(s),
      0
    );
}


function totalCosts(){

  return validSales()
    .reduce(
      (sum,s)=>
        sum + saleCost(s),
      0
    );
}


function totalExpenses(){

  return validSales()
    .reduce(
      (sum,s)=>
        sum +
        saleShipping(s) +
        saleFees(s),
      0
    );
}


function totalProfit(){

  return validSales()
    .reduce(
      (sum,s)=>
        sum + saleProfit(s),
      0
    );
}


function soldQuantity(){

  return validSales()
    .reduce(
      (sum,s)=>
        sum +
        Math.max(
          1,
          number(s.qty)
        ),
      0
    );
}


function inventoryQuantity(){

  return data.artikel
    .reduce(
      (sum,a)=>
        sum +
        Math.max(
          0,
          number(a.menge)
        ),
      0
    );
}


function inventoryValue(){

  return data.artikel
    .reduce(
      (sum,a)=>
        sum +
        Math.max(
          0,
          number(a.menge)
        ) *
        number(a.preis),
      0
    );
}


function averageMargin(){

  const revenue =
    totalRevenue();

  if(!revenue){
    return 0;
  }

  return (
    totalProfit() /
    revenue *
    100
  );
}

/* =========================================================
   PLATTFORMEN
========================================================= */

function renderPlatforms(){

  const map = {};

  validSales().forEach(s=>{

    const platform =
      normalizePlatform(
        s.platform
      );

    if(!map[platform]){

      map[platform] = {
        revenue:0,
        profit:0,
        qty:0
      };

    }

    map[platform].revenue +=
      saleRevenue(s);

    map[platform].profit +=
      saleProfit(s);

    map[platform].qty +=
      Math.max(
        1,
        number(s.qty)
      );

  });

  const entries =
    Object.entries(map)
      .sort(
        (a,b)=>
          b[1].revenue -
          a[1].revenue
      );

  if(!entries.length){

    return `
      <div class="empty">
        Noch keine Verkäufe vorhanden.
      </div>
    `;
  }

  return entries.map(
    ([name,value])=>`

      <div class="row">

        <div class="rowTop">

          <div>

            <div class="rowTitle">
              ${escapeHTML(name)}
            </div>

            <div class="rowSub">
              ${value.qty} Stück
            </div>

          </div>

          <div class="rowValue">

            ${formatEuro(
              value.revenue
            )}

            <br>

            <span class="${
              value.profit >= 0
              ? "green"
              : "red"
            }">

              ${formatEuro(
                value.profit
              )}

            </span>

          </div>

        </div>

      </div>
    `
  ).join("");
}


/* =========================================================
   EINKAUFSORTE
========================================================= */

function renderSources(){

  const map = {};

  data.artikel.forEach(a=>{

    const source =
      normalizeSource(a.ort);

    if(!map[source]){

      map[source] = {
        qty:0,
        value:0,
        items:0
      };

    }

    map[source].qty +=
      Math.max(
        0,
        number(a.menge)
      );

    map[source].value +=
      Math.max(
        0,
        number(a.menge)
      ) *
      number(a.preis);

    map[source].items++;

  });

  const entries =
    Object.entries(map)
      .sort(
        (a,b)=>
          b[1].value -
          a[1].value
      );

  if(!entries.length){

    return `
      <div class="empty">
        Keine Einkaufsorte vorhanden.
      </div>
    `;
  }

  return entries.map(
    ([source,value])=>`

      <div class="row">

        <div class="rowTop">

          <div>

            <div class="rowTitle">
              ${escapeHTML(source)}
            </div>

            <div class="rowSub">
              ${value.items} Positionen
              ·
              ${value.qty} Stück
            </div>

          </div>

          <div class="rowValue">
            ${formatEuro(
              value.value
            )}
          </div>

        </div>

        <div class="actions">

          <button
            class="smallButton"
            onclick='showPurchaseSource(${JSON.stringify(source)})'>

            Einkäufe anzeigen

          </button>

        </div>

      </div>
    `
  ).join("");
}

========================================================= */

function openDocument(source,title){

  if(!source){
    return;
  }

  currentDocument = {
    source,
    title:
      title ||
      "Rechnung / Beleg"
  };

  document.getElementById(
    "viewerTitle"
  ).textContent =
    currentDocument.title;

  const content =
    document.getElementById(
      "viewerContent"
    );

  content.innerHTML = "";

  /*
    Data-URLs und normale Bilddateien
  */

  if(
    source.startsWith(
      "data:image/"
    )
    ||
    /\.(jpg|jpeg|png|gif|webp)(\?.*)?$/i
      .test(source)
  ){

    const img =
      document.createElement("img");

    img.src = source;

    img.alt =
      currentDocument.title;

    content.appendChild(img);

  }

  /*
    PDF
  */

  else if(
    source.startsWith(
      "data:application/pdf"
    )
    ||
    /\.pdf(\?.*)?$/i.test(source)
  ){

    const iframe =
      document.createElement(
        "iframe"
      );

    iframe.src = source;

    content.appendChild(
      iframe
    );

  }

  /*
    Sonstige Datei
  */

  else{

    content.innerHTML = `

      <div
        style="
          text-align:center;
          color:#8e8e93;
          font-size:14px;
          line-height:22px;
        ">

        <div style="
          font-size:40px;
          margin-bottom:12px;
        ">
          📄
        </div>

        Der Beleg kann direkt
        heruntergeladen werden.

        <br><br>

        <button
          class="smallButton greenButton"
          onclick="downloadCurrentDocument()">

          Datei herunterladen

        </button>

      </div>

    `;

  }

  document.getElementById(
    "viewer"
  ).classList.add("show");

}

  document.getElementById(
    "viewer"
  ).classList.remove("show");

  document.getElementById(

}


/* =========================================================
   BELEG DOWNLOAD
========================================================= */

function downloadCurrentDocument(){

  if(!currentDocument){
    return;
  }

  const source =
    currentDocument.source;

  const filename =
    makeSafeFilename(
      currentDocument.title ||
      "Beleg"
    );

  /*
    Data-URL
  */

  if(
    source.startsWith("data:")
  ){

    const parts =
      source.split(",");

    const meta =
      parts[0];

    const body =
      parts.slice(1).join(",");

    const mime =
      (
        meta.match(
          /data:([^;]+)/i
        ) || []
      )[1]
      ||
      "application/octet-stream";

    let blob;

    if(
      meta.includes(";base64")
    ){

      const binary =
        atob(body);

      const bytes =
        new Uint8Array(
          binary.length
        );

      for(
        let i=0;
        i<binary.length;
        i++
      ){

        bytes[i] =
          binary.charCodeAt(i);

      }

      blob =
        new Blob(
          [bytes],
          {type:mime}
        );

    }
    else{

      blob =
        new Blob(
          [decodeURIComponent(body)],
          {type:mime}
        );

    }

    downloadBlob(
      blob,
      filename +
      extensionFromMime(mime)
    );

    return;
  }

  /*
    Normale URL
  */

  const link =
    document.createElement("a");

  link.href = source;
  link.download =
    filename;

  link.target = "_blank";
  link.rel = "noopener";

  document.body.appendChild(link);

  link.click();

  link.remove();

}


function downloadBlob(blob,filename){

  const url =
    URL.createObjectURL(blob);

  const link =
    document.createElement("a");

  link.href = url;
  link.download = filename;

  document.body.appendChild(link);

  link.click();

  link.remove();

  setTimeout(
    () =>
      URL.revokeObjectURL(url),
    1000
  );

}


function extensionFromMime(mime){

  if(
    mime === "application/pdf"
  ){
    return ".pdf";
  }

  if(
    mime === "image/jpeg"
  ){
    return ".jpg";
  }

  if(
    mime === "image/png"
  ){
    return ".png";
  }

  if(
    mime === "image/webp"
  ){
    return ".webp";
  }

  return "";
}


function makeSafeFilename(name){

  return clean(name)
    .replace(/[\\/:*?"<>|]/g,"_")
    .replace(/\s+/g," ")
    .trim();

}

function copyText(text){

  if(
    navigator.clipboard &&
    navigator.clipboard.writeText
  ){

    navigator.clipboard
      .writeText(text)
      .then(
        () =>
          alert(
            "Daten kopiert."
          )
      )
      .catch(
        () =>
          fallbackCopy(text)
      );

  }
  else{

    fallbackCopy(text);

  }
}


function fallbackCopy(text){

  const textarea =
    document.createElement(
      "textarea"
    );

  textarea.value = text;

  textarea.style.position =
    "fixed";

  textarea.style.opacity =
    "0";

  document.body.appendChild(
    textarea
  );

  textarea.select();

  document.execCommand(
    "copy"
  );

  textarea.remove();

  alert(
    "Daten kopiert."
  );
}

    alert(
      "Keine Artikelnummer vorhanden."
    );

    return;
  }

  searchText(artnr);
}


/* =========================================================
   HTML SICHERHEIT
========================================================= */

function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}


/* =========================================================
   MODAL KLICK AUSSEN
========================================================= */

document
  .querySelectorAll(".modalBack")
  .forEach(modal=>{

    modal.addEventListener(
      "click",
      event=>{

        if(
          event.target === modal
        ){

          modal.classList.remove(
            "show"
          );

        }

      }
    );

  });


/* =========================================================
   ESC / ZURÜCK
========================================================= */

document.addEventListener(
  "keydown",
  event=>{

    if(event.key !== "Escape"){
      return;
    }

    const viewer =
      document.getElementById(
        "viewer"
      );

    if(
      viewer.classList.contains(
        "show"
      )
    ){

      closeViewer();
      return;
    }

    closeDetail();
    closeImport();

  }
);


/*
  Auf iPhone verhindert die App,
  dass ein geöffneter Beleg einen
  separaten Browser-Verlauf erzeugt.

  Dadurch funktioniert der Rückbutton
  innerhalb der App zuverlässig.
*/

window.addEventListener(
  "popstate",
  ()=>{
    closeViewer();
    closeDetail();
  }
);

</script>
