<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>LagerManager Analytics</title>

<style>
:root{
  --bg:#000;
  --card:#111;
  --card2:#181818;
  --line:#292929;
  --text:#f5f5f7;
  --muted:#8e8e93;
  --green:#30d158;
  --red:#ff453a;
  --blue:#0a84ff;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}

body{
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}

button,input,select{
  font:inherit;
}

button{
  border:0;
  color:var(--text);
  background:#1c1c1e;
  border-radius:12px;
  padding:10px 14px;
  cursor:pointer;
}

button:active{
  opacity:.65;
  transform:scale(.98);
}

.app{
  max-width:1100px;
  margin:auto;
  min-height:100vh;
}

.header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(0,0,0,.94);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
  padding:12px 14px 10px;
}

.headerTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.title{
  font-size:22px;
  font-weight:700;
  letter-spacing:-.5px;
}

.subtitle{
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
}

.headerButtons{
  display:flex;
  gap:6px;
}

.iconBtn{
  width:40px;
  height:40px;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

.searchBox{
  margin-top:10px;
  position:relative;
}

.searchBox input{
  width:100%;
  height:44px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#1c1c1e;
  color:white;
  padding:0 42px 0 40px;
  outline:none;
  font-size:16px;
}

.searchBox input:focus{
  border-color:#444;
}

.searchIcon{
  position:absolute;
  left:14px;
  top:11px;
  color:var(--muted);
  font-size:19px;
}

.clearSearch{
  position:absolute;
  right:9px;
  top:7px;
  width:30px;
  height:30px;
  padding:0;
  border-radius:50%;
  background:#3a3a3c;
  color:#aaa;
  display:none;
}

.tabs{
  display:flex;
  background:#1c1c1e;
  border-radius:12px;
  padding:2px;
  margin-top:10px;
}

.tab{
  flex:1;
  background:transparent;
  padding:8px;
  font-size:13px;
  color:var(--muted);
}

.tab.active{
  background:#3a3a3c;
  color:white;
  font-weight:600;
}

.content{
  padding:12px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-bottom:12px;
}

.stat{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
  min-height:72px;
}

.statLabel{
  font-size:11px;
  color:var(--muted);
  margin-bottom:5px;
}

.statValue{
  font-size:20px;
  font-weight:700;
  letter-spacing:-.4px;
}

.green{color:var(--green)}
.red{color:var(--red)}

.section{
  margin-bottom:14px;
}

.sectionHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:7px;
}

.sectionTitle{
  font-size:17px;
  font-weight:700;
}

.sectionInfo{
  color:var(--muted);
  font-size:11px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
}

.row{
  padding:11px 12px;
  border-bottom:1px solid var(--line);
}

.row:last-child{
  border-bottom:0;
}

.rowTop{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.rowTitle{
  font-size:14px;
  font-weight:600;
}

.rowSub{
  margin-top:3px;
  color:var(--muted);
  font-size:12px;
  line-height:1.4;
}

.rowValue{
  text-align:right;
  white-space:nowrap;
  font-size:13px;
  font-weight:600;
}

.badge{
  display:inline-block;
  padding:3px 7px;
  border-radius:7px;
  background:#292929;
  color:#ddd;
  font-size:10px;
  margin-right:4px;
}

.badge.greenBadge{
  color:var(--green);
}

.badge.redBadge{
  color:var(--red);
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:8px;
}

.smallBtn{
  padding:7px 10px;
  border-radius:9px;
  font-size:12px;
}

.empty{
  padding:28px 15px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}

th{
  text-align:left;
  color:var(--muted);
  font-weight:500;
  padding:9px 8px;
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}

td{
  padding:9px 8px;
  border-bottom:1px solid var(--line);
  vertical-align:top;
}

tr:last-child td{
  border-bottom:0;
}

.scroll{
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}

.modalBack{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.72);
  display:none;
  align-items:flex-end;
  justify-content:center;
}

.modalBack.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:650px;
  max-height:92vh;
  overflow:auto;
  background:#1c1c1e;
  border-radius:20px 20px 0 0;
  padding:15px;
  padding-bottom:calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 50px rgba(0,0,0,.5);
}

.modalHandle{
  width:38px;
  height:5px;
  border-radius:4px;
  background:#555;
  margin:0 auto 15px;
}

.modalTitle{
  font-size:20px;
  font-weight:700;
  margin-bottom:12px;
}

.field{
  margin-bottom:11px;
}

.field label{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin:0 0 5px 3px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid #333;
  border-radius:11px;
  background:#2c2c2e;
  color:white;
  padding:10px 11px;
  outline:none;
  font-size:15px;
}

.field textarea{
  min-height:90px;
  resize:vertical;
}

.modalActions{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.modalActions button{
  flex:1;
}

.primary{
  background:var(--green);
  color:#000;
  font-weight:700;
}

.danger{
  background:var(--red);
  color:#fff;
  font-weight:600;
}

.secondary{
  background:#3a3a3c;
}

.fileInput{
  display:none;
}

.infoBox{
  padding:11px;
  border-radius:11px;
  background:#252527;
  color:#ccc;
  font-size:12px;
  line-height:1.5;
  margin-bottom:12px;
}

.searchResultCount{
  color:var(--muted);
  font-size:11px;
  margin:7px 2px 10px;
}

@media(min-width:700px){
  .stats{
    grid-template-columns:repeat(4,1fr);
  }
}

@media(prefers-reduced-motion:no-preference){
  button,input{
    transition:.15s ease;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="headerTop">
    <div>
      <div class="title">Analytics</div>
      <div class="subtitle">LagerManager Auswertung</div>
    </div>

    <div class="headerButtons">
      <button class="iconBtn" onclick="openImport()" title="Import">↥</button>
      <button class="iconBtn" onclick="exportData()" title="Export">↧</button>
    </div>
  </div>

  <div class="searchBox">
    <span class="searchIcon">⌕</span>
    <input id="globalSearch"
           type="search"
           placeholder="Alles durchsuchen …"
           autocomplete="off"
           oninput="runSearch()">
    <button id="clearSearch"
            class="clearSearch"
            onclick="clearSearch()">×</button>
  </div>

  <div class="tabs">
    <button id="tabOverview" class="tab active" onclick="setTab('overview')">Übersicht</button>
    <button id="tabSales" class="tab" onclick="setTab('sales')">Verkäufe</button>
    <button id="tabPurchases" class="tab" onclick="setTab('purchases')">Einkäufe</button>
    <button id="tabSearch" class="tab" onclick="setTab('search')">Suche</button>
  </div>
</header>

<main class="content" id="content"></main>

</div>

<!-- IMPORT -->
<div class="modalBack" id="importModal">
  <div class="modal">
    <div class="modalHandle"></div>
    <div class="modalTitle">LagerManager-Daten importieren</div>

    <div class="infoBox">
      Wähle die JSON-Sicherungsdatei aus deiner LagerManager-App aus.
      Die Daten werden nur in dieser Analytics-App verarbeitet.
    </div>

    <input id="jsonFile" class="fileInput" type="file" accept=".json,application/json">

    <div class="modalActions">
      <button class="secondary" onclick="closeImport()">Abbrechen</button>
      <button class="primary" onclick="document.getElementById('jsonFile').click()">Datei wählen</button>
    </div>
  </div>
</div>

<!-- DETAIL -->
<div class="modalBack" id="detailModal">
  <div class="modal">
    <div class="modalHandle"></div>
    <div id="detailContent"></div>
    <div class="modalActions">
      <button class="secondary" onclick="closeDetail()">Schließen</button>
    </div>
  </div>
</div>

<script>
"use strict";

/* =========================================================
   DATEN
========================================================= */

let data = {
  artikel: [],
  sales: []
};

let currentTab = "overview";
let searchResults = [];

const STORAGE_KEY = "LagerManagerAnalyticsV2";

/* =========================================================
   START
========================================================= */

document.addEventListener("DOMContentLoaded", () => {
  loadLocalData();

  document.getElementById("jsonFile").addEventListener("change", importJSON);

  render();
});

/* =========================================================
   NORMALISIERUNG
========================================================= */

function clean(v){
  if(v === null || v === undefined) return "";
  return String(v).trim();
}

function lower(v){
  return clean(v).toLocaleLowerCase("de-DE");
}

function normalizePlatform(v){
  const x = lower(v);

  if(x === "ebay") return "eBay";
  if(x === "vinted") return "Vinted";
  if(x === "kleinanzeigen") return "Kleinanzeigen";
  if(x === "amazon") return "Amazon";
  if(x === "etsy") return "Etsy";
  if(x === "shopify") return "Shopify";
  if(x === "paypal") return "PayPal";
  if(x === "flohmarkt") return "Flohmarkt";

  return clean(v) || "Sonstiges";
}

function normalizeSource(v){
  const x = lower(v);

  const map = {
    "müller":"Müller",
    "mueller":"Müller",
    "sportspar":"Sportspar",
    "picksport":"Picksport",
    "amazon":"Amazon",
    "ebay":"eBay",
    "kleinanzeigen":"Kleinanzeigen",
    "vinted":"Vinted"
  };

  return map[x] || clean(v) || "Unbekannt";
}

function normalizeSize(v){
  return clean(v).toLocaleUpperCase("de-DE");
}

/* =========================================================
   ARTIKELNAME
   Erstes Wort ist immer der Artikelname
========================================================= */

function getArticleName(name){
  const value = clean(name);

  if(!value) return "Unbekannt";

  return value.split(/\s+/)[0];
}

/* =========================================================
   ZAHLEN / DATEN
========================================================= */

function number(v){
  if(typeof v === "number") return isFinite(v) ? v : 0;

  let s = clean(v)
    .replace(/[€$]/g,"")
    .replace(/\s/g,"");

  if(!s) return 0;

  if(s.includes(",") && s.includes(".")){
    if(s.lastIndexOf(",") > s.lastIndexOf(".")){
      s = s.replace(/\./g,"").replace(",",".");
    }else{
      s = s.replace(/,/g,"");
    }
  }else{
    s = s.replace(",",".");
  }

  const n = parseFloat(s);
  return isFinite(n) ? n : 0;
}

function formatEuro(v){
  return number(v).toLocaleString("de-DE",{
    style:"currency",
    currency:"EUR"
  });
}

function formatDate(v){
  const s = clean(v);
  if(!s) return "—";

  const d = new Date(s);

  if(!isNaN(d)){
    return d.toLocaleDateString("de-DE");
  }

  if(/^\d{2}-\d{2}-\d{4}$/.test(s)) return s;

  if(/^\d{4}-\d{2}-\d{2}$/.test(s)){
    const [y,m,day] = s.split("-");
    return `${day}.${m}.${y}`;
  }

  return s;
}

function dateValue(v){
  if(!v) return 0;

  const d = new Date(v);

  if(!isNaN(d)) return d.getTime();

  const m = clean(v).match(/^(\d{2})[-./](\d{2})[-./](\d{4})$/);

  if(m){
    return new Date(
      Number(m[3]),
      Number(m[2])-1,
      Number(m[1])
    ).getTime();
  }

  return 0;
}

/* =========================================================
   STORNO
========================================================= */

function isStorno(s){
  return s && (
    s.isStorno === true ||
    lower(s.isStorno) === "true" ||
    lower(s.status) === "storno"
  );
}

/* =========================================================
   VERKAUFSDATEN
========================================================= */

function saleRevenue(s){
  return number(s.total);
}

function saleShipping(s){
  return number(s.shipping);
}

function saleFees(s){
  return number(s.fees);
}

function saleCost(s){
  return number(s.buyPrice) * Math.max(1,number(s.qty));
}

function saleProfit(s){
  if(isStorno(s)) return 0;

  return saleRevenue(s)
    - saleShipping(s)
    - saleFees(s)
    - saleCost(s);
}

/* =========================================================
   KÄUFER / ADRESSE
========================================================= */

function addressParts(s){
  const a = s.address;

  if(typeof a === "object" && a !== null){
    return {
      name:clean(a.name || a.vorname || a.fullName),
      street:clean(a.street || a.strasse || a.address),
      zip:clean(a.zip || a.plz || a.postcode),
      city:clean(a.city || a.stadt || a.ort),
      country:clean(a.country || a.land)
    };
  }

  const text = clean(a);

  return {
    name:clean(s.name),
    street:text,
    zip:"",
    city:"",
    country:""
  };
}

function buyerName(s){
  const a = addressParts(s);

  return clean(
    s.name ||
    a.name ||
    s.kundenname ||
    s.buyer ||
    s.buyerName
  );
}

function buyerCity(s){
  const a = addressParts(s);

  return clean(
    a.city ||
    s.city ||
    s.stadt ||
    s.kundenstadt ||
    s.ort
  );
}

function buyerZip(s){
  const a = addressParts(s);

  return clean(
    a.zip ||
    s.zip ||
    s.plz
  );
}

function buyerStreet(s){
  const a = addressParts(s);

  return clean(
    a.street ||
    s.street ||
    s.strasse
  );
}

/* =========================================================
   UNIVERSAL SEARCH
========================================================= */

function searchableSale(s){

  const a = addressParts(s);

  return [
    s.invoiceNr,
    s.rechnungsnummer,
    s.artnr,
    s.name,
    s.artikelname,
    s.platform,
    normalizePlatform(s.platform),
    s.date,
    s.verkaufsdatum,
    s.buyDate,
    s.kaufdatum,
    s.sourcingLoc,
    normalizeSource(s.sourcingLoc),
    s.groesse,
    s.size,
    normalizeSize(s.groesse),
    buyerName(s),
    buyerCity(s),
    buyerZip(s),
    buyerStreet(s),
    a.country,
    s.notiz,
    s.note,
    s.total,
    s.buyPrice,
    s.shipping,
    s.fees
  ].map(clean).join(" | ").toLocaleLowerCase("de-DE");
}

function searchableArticle(a){

  return [
    a.artnr,
    a.name,
    getArticleName(a.name),
    a.groesse,
    a.size,
    normalizeSize(a.groesse),
    a.zustand,
    a.ort,
    normalizeSource(a.ort),
    a.datum,
    a.kaufdatum,
    a.preis,
    a.notiz,
    a.note,
    a.menge
  ].map(clean).join(" | ").toLocaleLowerCase("de-DE");
}

function runSearch(){

  const input = document.getElementById("globalSearch");
  const q = lower(input.value);

  document.getElementById("clearSearch").style.display =
    q ? "block" : "none";

  if(!q){
    searchResults = [];
    render();
    return;
  }

  const terms = q
    .split(/\s+/)
    .filter(Boolean);

  const sales = data.sales.filter(s => {

    const text = searchableSale(s);

    return terms.every(term => text.includes(term));
  });

  const articles = data.artikel.filter(a => {

    const text = searchableArticle(a);

    return terms.every(term => text.includes(term));
  });

  searchResults = {sales,articles};

  currentTab = "search";
  updateTabs();
  renderSearch();
}

function clearSearch(){
  document.getElementById("globalSearch").value = "";
  document.getElementById("clearSearch").style.display = "none";
  searchResults = [];
  currentTab = "overview";
  updateTabs();
  render();
}

/* =========================================================
   LOKALE DATEN
========================================================= */

function loadLocalData(){

  try{
    const saved = localStorage.getItem(STORAGE_KEY);

    if(saved){
      const parsed = JSON.parse(saved);

      if(parsed && typeof parsed === "object"){
        data.artikel = Array.isArray(parsed.artikel)
          ? parsed.artikel
          : [];

        data.sales = Array.isArray(parsed.sales)
          ? parsed.sales
          : [];
      }
    }
  }catch(e){
    console.warn(e);
  }
}

function saveLocalData(){
  try{
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );
  }catch(e){
    console.warn(e);
  }
}

/* =========================================================
   IMPORT
========================================================= */

function openImport(){
  document.getElementById("importModal").classList.add("show");
}

function closeImport(){
  document.getElementById("importModal").classList.remove("show");
}

function importJSON(event){

  const file = event.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = e => {

    try{

      const parsed = JSON.parse(e.target.result);

      const artikel =
        parsed.artikel ||
        parsed.inventory ||
        parsed.items ||
        [];

      const sales =
        parsed.sales ||
        parsed.verkaeufe ||
        parsed.verkäufe ||
        [];

      data = {
        artikel:Array.isArray(artikel) ? artikel : [],
        sales:Array.isArray(sales) ? sales : []
      };

      saveLocalData();
      closeImport();

      currentTab = "overview";
      updateTabs();
      render();

      alert(
        "Import erfolgreich.\n\n" +
        data.artikel.length + " Artikel\n" +
        data.sales.length + " Verkäufe"
      );

    }catch(err){

      alert("Die JSON-Datei konnte nicht gelesen werden.");
      console.error(err);
    }

    event.target.value = "";
  };

  reader.readAsText(file);
}

/* =========================================================
   EXPORT
========================================================= */

function exportData(){

  const blob = new Blob(
    [JSON.stringify(data,null,2)],
    {type:"application/json"}
  );

  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");

  a.href = url;
  a.download =
    "LagerManager-Analytics-" +
    new Date().toISOString().slice(0,10) +
    ".json";

  a.click();

  URL.revokeObjectURL(url);
}

/* =========================================================
   TABS
========================================================= */

function setTab(tab){

  currentTab = tab;

  updateTabs();
  render();
}

function updateTabs(){

  document.querySelectorAll(".tab").forEach(x =>
    x.classList.remove("active")
  );

  const map = {
    overview:"tabOverview",
    sales:"tabSales",
    purchases:"tabPurchases",
    search:"tabSearch"
  };

  const el = document.getElementById(map[currentTab]);

  if(el) el.classList.add("active");
}

/* =========================================================
   STATISTIK
========================================================= */

function getValidSales(){
  return data.sales.filter(s => !isStorno(s));
}

function getRevenue(){
  return getValidSales()
    .reduce((sum,s) => sum + saleRevenue(s),0);
}

function getCosts(){
  return getValidSales()
    .reduce((sum,s) => sum + saleCost(s),0);
}

function getExpenses(){
  return getValidSales()
    .reduce(
      (sum,s) =>
        sum + saleShipping(s) + saleFees(s),
      0
    );
}

function getProfit(){
  return getValidSales()
    .reduce((sum,s) => sum + saleProfit(s),0);
}

function getSoldQty(){
  return getValidSales()
    .reduce(
      (sum,s) =>
        sum + Math.max(1,number(s.qty)),
      0
    );
}

function getInventoryQty(){
  return data.artikel
    .reduce(
      (sum,a) =>
        sum + Math.max(0,number(a.menge)),
      0
    );
}

function getInventoryValue(){
  return data.artikel
    .reduce(
      (sum,a) =>
        sum +
        Math.max(0,number(a.menge)) *
        number(a.preis),
      0
    );
}

function getAverageMargin(){

  const revenue = getRevenue();

  if(!revenue) return 0;

  return getProfit() / revenue * 100;
}

/* =========================================================
   RENDER
========================================================= */

function render(){

  if(currentTab === "search"){
    renderSearch();
    return;
  }

  if(currentTab === "sales"){
    renderSales();
    return;
  }

/* =========================================================
   PLATTFORMEN
========================================================= */

function renderPlatforms(){

  const map = {};

  getValidSales().forEach(s => {

    const p = normalizePlatform(s.platform);

    if(!map[p]){
      map[p] = {
        revenue:0,
        profit:0,
        qty:0
      };
    }

    map[p].revenue += saleRevenue(s);
    map[p].profit += saleProfit(s);
    map[p].qty += Math.max(1,number(s.qty));
  });

  const arr = Object.entries(map)
    .sort((a,b) => b[1].revenue - a[1].revenue);

  if(!arr.length){
    return `<div class="empty">Noch keine Verkäufe vorhanden.</div>`;
  }

  return arr.map(([name,v]) => `

    <div class="row">
      <div class="rowTop">
        <div>
          <div class="rowTitle">${escapeHTML(name)}</div>
          <div class="rowSub">${v.qty} Stück</div>
        </div>

        <div class="rowValue">
          ${formatEuro(v.revenue)}
          <br>
          <span class="${v.profit >= 0 ? "green":"red"}">
            ${formatEuro(v.profit)}
          </span>
        </div>
      </div>
    </div>

  `).join("");
}

/* =========================================================
   EINKAUFSORTE
========================================================= */

function renderSources(){

  const map = {};

  data.artikel.forEach(a => {

    const source = normalizeSource(a.ort);

    if(!map[source]){
      map[source] = {
        qty:0,
        value:0,
        items:0
      };
    }

    map[source].qty += Math.max(0,number(a.menge));
    map[source].value +=
      Math.max(0,number(a.menge)) * number(a.preis);

    map[source].items++;
  });

  const arr = Object.entries(map)
    .sort((a,b) => b[1].value - a[1].value);

  if(!arr.length){
    return `<div class="empty">Keine Einkaufsorte vorhanden.</div>`;
  }

  return arr.map(([source,v]) => `

    <div class="row">
      <div class="rowTop">

        <div>
          <div class="rowTitle">
            ${escapeHTML(source)}
          </div>

          <div class="rowSub">
            ${v.items} Positionen · ${v.qty} Stück
          </div>
        </div>

        <div class="rowValue">
          ${formatEuro(v.value)}
        </div>

      </div>

      <div class="actions">
        <button class="smallBtn"
          onclick='showPurchaseSource(${JSON.stringify(source)})'>
          Einkäufe anzeigen
        </button>
      </div>

    </div>

  `).join("");
}

    `Gebühren: ${formatEuro(s.fees)}`,

function copyPurchaseData(id){

  const a = findArticle(id);

  if(!a) return;

  const qty = number(a.menge);
  const price = number(a.preis);

  const text = [
    `Artikel: ${a.name || ""}`,

    `Zustand: ${a.zustand || ""}`,

    `Menge: ${qty}`,
    `Einkaufspreis/Stück: ${formatEuro(price)}`,
    `Gesamt: ${formatEuro(qty * price)}`,
    `Notiz: ${a.notiz || ""}`
  ].join("\n");

  copyText(text);
}

function copyText(text){

  if(navigator.clipboard){

    navigator.clipboard.writeText(text)
      .then(() => alert("Daten kopiert."))
      .catch(() => fallbackCopy(text));

  }else{

    fallbackCopy(text);

  }
}

function fallbackCopy(text){

  const textarea = document.createElement("textarea");

  textarea.value = text;
  textarea.style.position = "fixed";
  textarea.style.opacity = "0";

  document.body.appendChild(textarea);

  textarea.select();
  document.execCommand("copy");

  textarea.remove();

  alert("Daten kopiert.");
}

/* =========================================================
   RECHNUNGSBILD
========================================================= */

function openInvoiceImage(src){

  if(!src) return;

  const win = window.open();

  if(!win){
    alert("Das Öffnen des Belegs wurde vom Browser blockiert.");
    return;
  }

  win.document.write(`
    <html>
      <head>
        <title>Rechnung</title>
        <meta name="viewport"
          content="width=device-width,initial-scale=1">
        <style>
          body{
            margin:0;
            background:#000;
            display:flex;
            align-items:center;
            justify-content:center;
            min-height:100vh;
          }
          img{
            max-width:100%;
            max-height:100vh;
            object-fit:contain;
          }
        </style>
      </head>
      <body>
        <img src="${escapeAttribute(src)}">
      </body>
    </html>
  `);
}

/* =========================================================
   HTML SICHERHEIT
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function escapeAttribute(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

/* =========================================================
   MODAL AUSSEN KLICK
========================================================= */

document.querySelectorAll(".modalBack").forEach(modal => {

  modal.addEventListener("click", e => {

    if(e.target === modal){
      modal.classList.remove("show");
    }

  });

});
